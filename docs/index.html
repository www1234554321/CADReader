<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAD 平面圖閱讀器與微編輯器 (CAD Reader & Mini-Editor)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{color:#e2e8f0;-webkit-user-select:none;user-select:none;background-color:#121824;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica Neue,Arial,sans-serif;overflow:hidden}#cadCanvas{cursor:crosshair;touch-action:none;background-color:#1e293b}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:#1e293b}::-webkit-scrollbar-thumb{background:#475569;border-radius:3px}::-webkit-scrollbar-thumb:hover{background:#64748b}</style>
  <script type="module" crossorigin src="./assets/index-Ch72zHV2.js"></script>
</head>
<body class="h-full flex flex-col overflow-hidden">
  <!-- Top Navigation Header -->
  <header class="bg-slate-900 border-b border-slate-800 px-3 py-2 flex items-center justify-between z-20 shrink-0 gap-2 overflow-x-auto">
    <div class="flex items-center space-x-2 shrink-0">
      <div class="bg-indigo-600 p-1.5 rounded-lg text-white font-bold flex items-center space-x-1.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
        <span class="text-sm tracking-wide hidden sm:inline">CAD Reader</span>
      </div>
      <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 font-mono hidden sm:inline">.dwg / .dxf</span>
    </div>

    <!-- Central Action Buttons -->
    <div class="flex items-center space-x-1.5 shrink-0">
      <!-- File Open Button -->
      <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1.5 rounded-md text-xs font-medium transition flex items-center space-x-1 border border-slate-700">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span class="hidden xs:inline">開啟 CAD 檔案</span>
        <span class="xs:hidden">開啟</span>
        <input type="file" id="fileInput" accept=".dwg,.dxf" class="hidden" />
      </label>

      <!-- Load Sample Button -->
      <button id="btnLoadSample" class="bg-indigo-900/60 hover:bg-indigo-800 text-indigo-200 px-2.5 py-1.5 rounded-md text-xs font-medium transition border border-indigo-700 flex items-center space-x-1">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span class="hidden sm:inline">載入範例平面圖</span>
        <span class="sm:hidden">範例</span>
      </button>

      <!-- Export DXF Button -->
      <button id="btnExport" class="bg-emerald-800/80 hover:bg-emerald-700 text-emerald-100 px-2.5 py-1.5 rounded-md text-xs font-medium transition border border-emerald-600 flex items-center space-x-1">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span class="hidden sm:inline">導出 DXF</span>
        <span class="sm:hidden">導出</span>
      </button>

      <div class="h-4 w-px bg-slate-700 mx-0.5"></div>

      <!-- Recenter / Zoom Fit -->
      <button id="btnFitView" title="全景視角" class="p-1.5 hover:bg-slate-800 text-slate-300 rounded-md border border-slate-700 transition">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>

      <!-- Theme / Canvas BG Switch -->
      <button id="btnToggleBg" title="切換底色 (黑/白)" class="p-1.5 hover:bg-slate-800 text-slate-300 rounded-md border border-slate-700 transition">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      </button>

      <!-- Mobile Panel Drawer Toggle Button -->
      <button id="btnToggleSidebar" title="切換側邊欄 (圖層/屬性)" class="p-1.5 bg-indigo-900/50 hover:bg-indigo-800 text-indigo-200 rounded-md border border-indigo-700 transition md:hidden">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg>
      </button>
    </div>
  </header>

  <!-- Main Content Layout -->
  <div class="flex-1 flex relative overflow-hidden">
    <!-- Left Toolbar (Tools) -->
    <aside class="w-14 bg-slate-900 border-r border-slate-800 flex flex-col items-center py-3 space-y-2 z-10 shrink-0">
      <!-- Navigation / Select -->
      <button id="toolPan" class="tool-btn active p-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition group relative" title="平移 / 選擇 (Pan / Select)">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v6"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 0 1 2 2v4a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
      </button>

      <div class="w-8 h-px bg-slate-800 my-1"></div>

      <!-- Measure Length -->
      <button id="toolMeasureLength" class="tool-btn p-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition relative" title="量測長度 / 距離">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.4 2.4 0 0 1 0-3.4l2.6-2.6a2.4 2.4 0 0 1 3.4 0l12.6 12.6z"/><line x1="14.5" y1="5.5" x2="16.5" y2="7.5"/><line x1="10.5" y1="9.5" x2="12.5" y2="11.5"/><line x1="6.5" y1="13.5" x2="8.5" y2="15.5"/></svg>
      </button>

      <!-- Measure Area -->
      <button id="toolMeasureArea" class="tool-btn p-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition relative" title="量測面積">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3z"/><path d="M9 3v18"/><path d="M15 3v18"/><path d="M3 9h18"/><path d="M3 15h18"/></svg>
      </button>

      <!-- Scale Calibration -->
      <button id="toolCalibrate" class="tool-btn p-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition relative" title="比例尺校準 (Calibrate Scale)">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
      </button>

      <div class="w-8 h-px bg-slate-800 my-1"></div>

      <!-- Drawing Tools -->
      <button id="toolDrawLine" class="tool-btn p-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition relative" title="繪製直線">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/></svg>
      </button>

      <button id="toolDrawRect" class="tool-btn p-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition relative" title="繪製矩形">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      </button>

      <button id="toolDrawCircle" class="tool-btn p-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition relative" title="繪製圓形">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
      </button>

      <button id="toolDrawText" class="tool-btn p-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition relative" title="新增文字標籤">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
      </button>

      <div class="w-8 h-px bg-slate-800 my-1"></div>

      <!-- Delete Selected -->
      <button id="btnDeleteSelected" class="p-2.5 rounded-lg text-rose-400 hover:bg-rose-950 hover:text-rose-200 transition relative" title="刪除選取物件 (Delete)">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
      </button>

      <!-- Move Tool -->
      <button id="toolMove" class="tool-btn p-2.5 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition relative" title="移動選取物件 (Move)">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>
      </button>
    </aside>

    <!-- Canvas Container -->
    <main class="flex-1 relative bg-slate-950 overflow-hidden flex items-center justify-center">
      <canvas id="cadCanvas" class="w-full h-full block"></canvas>

      <!-- Snapping & Hint Overlay Banner -->
      <div id="toolTipBanner" class="absolute top-4 left-4 bg-slate-900/90 border border-slate-700/80 backdrop-blur text-slate-200 px-4 py-2 rounded-lg text-xs flex items-center space-x-2 shadow-lg pointer-events-none">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="toolTipText">模式：選擇 / 平移（按住滑鼠左鍵拖曳，滾輪縮放）</span>
      </div>

      <!-- Measurement Result Floating Panel -->
      <div id="measureOverlay" class="hidden absolute top-16 left-4 bg-slate-900/95 border border-indigo-500/50 backdrop-blur text-white p-3.5 rounded-lg shadow-xl text-xs space-y-1.5 w-60">
        <div class="font-bold text-indigo-400 flex justify-between items-center border-b border-slate-800 pb-1">
          <span id="measureTitle">長度量測結果</span>
          <button id="btnCloseMeasure" class="text-slate-400 hover:text-white">✕</button>
        </div>
        <div id="measureBody" class="space-y-1 font-mono text-slate-200">
          <div>總長度：<span id="measureValue" class="text-emerald-400 font-bold text-sm">0.00</span> mm</div>
        </div>
        <div class="text-[10px] text-slate-400 italic mt-1">點擊右鍵或 Enter 鍵結束量測</div>
      </div>
    </main>

    <!-- Mobile Backdrop for Sidebar -->
    <div id="sidebarBackdrop" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-20 hidden md:hidden"></div>

    <!-- Right Sidebar (Layers & Properties) -->
    <aside id="rightSidebar" class="w-72 bg-slate-900 border-l border-slate-800 flex flex-col z-30 shrink-0 fixed inset-y-0 right-0 transform translate-x-full md:relative md:translate-x-0 transition-transform duration-200 ease-in-out">
      <!-- Sidebar Header Tabs -->
      <div class="flex border-b border-slate-800 text-xs font-medium">
        <button id="tabLayers" class="flex-1 py-3 text-center border-b-2 border-indigo-500 text-indigo-400 font-semibold bg-slate-800/50">
          圖層管理 (Layers)
        </button>
        <button id="tabInspector" class="flex-1 py-3 text-center border-b-2 border-transparent text-slate-400 hover:text-slate-200">
          物件屬性 (Properties)
        </button>
      </div>

      <!-- Panel: Layers -->
      <div id="panelLayers" class="flex-1 overflow-y-auto p-3 space-y-2">
        <div class="text-xs text-slate-400 mb-2 flex justify-between items-center">
          <span>所有圖層列表</span>
          <span id="layerCount" class="bg-slate-800 px-2 py-0.5 rounded font-mono">0 個</span>
        </div>
        <div id="layerList" class="space-y-1 text-xs">
          <!-- Layer items will be dynamically generated -->
        </div>
      </div>

      <!-- Panel: Inspector (Selected Entity) -->
      <div id="panelInspector" class="hidden flex-1 overflow-y-auto p-3 space-y-3 text-xs">
        <div id="inspectorEmpty" class="text-slate-500 text-center py-8">
          未選擇任何物件。<br>使用選擇工具點擊圖面中的物件。
        </div>

        <div id="inspectorContent" class="hidden space-y-3">
          <div class="bg-slate-800/60 p-2.5 rounded border border-slate-700/60 space-y-2">
            <div class="font-bold text-indigo-300 flex items-center justify-between">
              <span>物件類型</span>
              <span id="propType" class="bg-indigo-950 text-indigo-200 px-2 py-0.5 rounded font-mono text-[10px]">LINE</span>
            </div>
            <div class="grid grid-cols-2 gap-2 text-slate-300">
              <div>圖層：<span id="propLayer" class="font-mono text-slate-100">0</span></div>
              <div>顏色：<span id="propColor" class="font-mono text-slate-100">BYLAYER</span></div>
            </div>
          </div>

          <!-- Specific Editable Fields -->
          <div id="fieldEditableText" class="hidden space-y-1.5">
            <label class="block text-slate-300">文字內容</label>
            <input type="text" id="inputPropText" class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-slate-100 focus:outline-none focus:border-indigo-500" />
            <button id="btnApplyTextProp" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-1 rounded text-xs transition">更新文字</button>
          </div>

          <div id="fieldGeometryInfo" class="space-y-1.5 font-mono text-slate-400 bg-slate-950 p-2.5 rounded border border-slate-800 text-[11px] overflow-x-auto">
            <!-- Geometry details (coords, lengths, radius) -->
          </div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Bottom Status Bar -->
  <footer class="bg-slate-950 border-t border-slate-800 px-4 py-1.5 text-[11px] font-mono text-slate-400 flex items-center justify-between shrink-0">
    <div class="flex items-center space-x-4">
      <div>座標 (X, Y): <span id="statusCoords" class="text-slate-200">0.00, 0.00</span></div>
      <div>縮放比: <span id="statusZoom" class="text-slate-200">100%</span></div>
      <div>總物件數: <span id="statusEntities" class="text-slate-200">0</span></div>
    </div>
    <div class="flex items-center space-x-3">
      <div>單位: <span id="statusUnit" class="text-indigo-400">毫米 (mm)</span></div>
      <div>1 單元 = <span id="statusScale" class="text-emerald-400">1.00</span> mm</div>
    </div>
  </footer>

  <!-- App Entrypoint Script -->
</body>
</html>
